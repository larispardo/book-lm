[project]
name = "booklm"
version = "0.1.0"
description = "A glass-box language model trained on the Sherlock Holmes canon."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["tokenizers>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
lab = ["streamlit>=1.57", "watchdog>=4"]
train = ["torch>=2.4", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["booklm*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
