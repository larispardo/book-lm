[project]
name = "booklm"
version = "0.1.0"
description = "A glass-box language model trained on one fictional universe, with an interactive logit and sampling explorer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7"]
video = ["manim>=0.18"]

[project.scripts]
booklm-data = "booklm.data:main"
booklm-train-scratch = "booklm.train_scratch:main"
booklm-train-lora = "booklm.train_lora:main"
booklm-serve = "booklm.server.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["booklm*"]

[tool.setuptools.package-data]
"booklm.server" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
